<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ClassCheck</title><meta name="theme-color" content="#fff7f8"><link rel="icon" href="assets/classcheck-favicon.svg?v=9" type="image/svg+xml"><style>html,body{background:#fff7f8}</style><link rel="stylesheet" href="css/styles.css?v=9"><link rel="stylesheet" href="css/responsive.css?v=9"></head><body class="classcheck-login">
<div class="login-wrap"><main class="login-card"><div class="logo-lockup"><div class="brand-mark">CC</div><div><b>ClassCheck</b><div class="eyebrow">Teacher Desk suite</div></div></div><div class="eyebrow">Teacher access</div><h1>Daily attendance, made simpler.</h1><p id="authNote">Sign in with your ClassCheck teacher account.</p>
<div class="auth-switch" role="tablist" aria-label="Account options"><button id="showSignIn" class="auth-switch-btn active" type="button">Sign in</button><button id="showCreate" class="auth-switch-btn" type="button">Create account</button></div>
<form id="loginForm" class="form-card"><div class="field"><label>Email</label><input id="email" class="input" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password" required></div><button type="submit" class="btn primary block">Log in</button></form>
<form id="createForm" class="form-card hidden"><div class="field"><label>Full name</label><input class="input" name="full_name" autocomplete="name" required placeholder="Juan Dela Cruz"></div><div class="field"><label>Email</label><input class="input" name="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input class="input" name="password" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label>Confirm password</label><input class="input" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required></div><button type="submit" class="btn primary block">Create teacher account</button></form>
<div class="demo-note"><b>For teachers.</b><br>Your classes and attendance are protected by your ClassCheck account.</div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=9"></script><script src="js/demo-data.js?v=9"></script><script src="js/storage.js?v=9.4"></script><script src="js/supabase-client.js?v=9"></script><script src="js/app.js?v=9"></script><script src="js/auth.js?v=9"></script></body></html>
