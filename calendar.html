<body class="classcheck-app">
  <main class="app-shell secondary-page">
    <header class="topbar page-topbar">
      <span class="topbar-spacer" aria-hidden="true"></span>
      <div class="page-title-stack"><h1>Calendar</h1></div>
      <a class="icon-btn" href="attendance.html" aria-label="Take attendance" data-icon="plus"></a>

    <section class="week-strip">

      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
