<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ClassCheck • Calendar</title><meta name="theme-color" content="#7a1730"><link rel="icon" href="assets/classcheck-favicon.svg?v=9" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/classcheck-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ClassCheck"><style>html,body{margin:0;background:#fff7f8!important}main.app-shell{min-height:100vh;background:#fff7f8!important;opacity:1!important}</style>
  <link rel="stylesheet" href="css/styles.css?v=10.2"><link rel="stylesheet" href="css/responsive.css?v=10.2"><link rel="prefetch" href="classes.html"><link rel="prefetch" href="attendance.html"><link rel="prefetch" href="reports.html"><link rel="prefetch" href="profile.html">
</head>
<body class="classcheck-app">
  <main class="app-shell secondary-page">
    <header class="topbar page-topbar">
      <span class="topbar-spacer" aria-hidden="true"></span>
      <div class="page-title-stack"><h1>Calendar</h1></div>
      <a class="icon-btn" href="attendance.html" aria-label="Take attendance" data-icon="plus"></a>
    </header>
    <section class="week-strip">
      <div class="week-title"><button id="prevMonth" class="icon-btn" aria-label="Previous month" data-icon="chevron-left"></button><h2 id="calendarPageMonthLabel">Month</h2><button id="nextMonth" class="icon-btn" aria-label="Next month" data-icon="chevron-right"></button></div>
      <div class="calendar-grid"><div class="cal-label">SUN</div><div class="cal-label">MON</div><div class="cal-label">TUE</div><div class="cal-label">WED</div><div class="cal-label">THU</div><div class="cal-label">FRI</div><div class="cal-label">SAT</div></div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
    <div class="card compact-note"><h3>Calendar guide</h3><p>A check means you finished at least one attendance session on that date. Tap any date to open attendance.</p></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=9"></script><script src="js/demo-data.js?v=9"></script><script src="js/storage.js?v=9.4"></script><script src="js/supabase-client.js?v=9"></script><script src="js/bootstrap.js?v=9"></script><script src="js/offline-db.js?v=9"></script><script src="js/app.js?v=10.2"></script><script src="js/calendar.js?v=9"></script>
<script src="js/pwa.js?v=10.2"></script>
</body>
</html>
