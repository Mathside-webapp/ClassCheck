<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ClassCheck • Profile</title><meta name="theme-color" content="#7a1730"><link rel="icon" href="assets/classcheck-favicon.svg?v=9" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/classcheck-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ClassCheck"><style>html,body{margin:0;background:#fff7f8!important}main.app-shell{min-height:100vh;background:#fff7f8!important;opacity:1!important}</style>
  <link rel="stylesheet" href="css/styles.css?v=10.5"><link rel="stylesheet" href="css/responsive.css?v=10.2"><link rel="prefetch" href="classes.html"><link rel="prefetch" href="attendance.html"><link rel="prefetch" href="calendar.html"><link rel="prefetch" href="reports.html">
</head>
<body class="classcheck-app">
  <main class="app-shell secondary-page">
    <header class="topbar page-topbar">
      <a href="classes.html" class="icon-btn" aria-label="Back" data-icon="arrow-left"></a>
      <div class="page-title-stack"><h1>Teacher Profile</h1></div>
      <div class="brand-mark">CC</div>
    </header>
    <form id="profileForm" class="card form-card">
      <div class="field"><label>Full name</label><input class="input" name="full_name"></div>
      <div class="field"><label>School name</label><input class="input" name="school_name"></div>
      <div class="field"><label>School head name</label><input class="input" name="school_head_name" placeholder="Printed name of the school head"></div>
      <div class="field"><label>School ID</label><input class="input" name="school_id"></div>
      <div class="field"><label>School year</label><input class="input" name="school_year"></div>
      <div class="field"><label>Region</label><input class="input" name="region"></div>
      <div class="field"><label>Division</label><input class="input" name="division"></div>
      <div class="field"><label>District</label><input class="input" name="district"></div>
      <div class="field"><label>Position</label><input class="input" name="position"></div>
      <button type="submit" class="btn primary block">Save profile</button><button type="button" id="signOutBtn" class="btn ghost block">Log out</button>
    </form>
<section class="pwa-install-card" aria-label="Install ClassCheck app">
  <div class="pwa-install-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2h14v-2"/></svg>
  </div>
  <div class="pwa-install-copy">
    <b>Install ClassCheck on your device</b>
    <span>Open attendance faster from your Home Screen or desktop.</span>
    <small data-pwa-status>Install from your browser</small>
  </div>
  <div class="pwa-install-actions">
    <button class="btn primary block" type="button" data-install-classcheck><span data-install-label>Install ClassCheck</span></button>
    <button class="btn soft block" type="button" data-install-help>How to install</button>
  </div>
</section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js?v=10.4"></script><script src="js/demo-data.js?v=9"></script><script src="js/storage.js?v=9.4"></script><script src="js/supabase-client.js?v=9"></script><script src="js/bootstrap.js?v=9"></script><script src="js/app.js?v=10.2"></script><script src="js/profile.js?v=9.2"></script>
<script src="js/pwa.js?v=10.2"></script>
</body>
</html>
