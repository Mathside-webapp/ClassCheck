<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7a1730">
  <title>ClassCheck • Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff7f8;color:#321d25;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}.card{width:min(440px,100%);background:#fff;border:1px solid #ead8de;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 50px rgba(67,24,40,.12)}.mark{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;background:#7a1730;display:grid;place-items:center}.mark svg{width:40px;height:40px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}h1{margin:0 0 10px;font-size:30px}p{margin:0 0 20px;color:#77676d;line-height:1.55}.btn{border:0;border-radius:13px;background:#7a1730;color:#fff;font:700 14px inherit;padding:13px 18px;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div>
    <h1>You’re offline</h1>
    <p>ClassCheck can keep previously loaded pages available, and locally saved attendance will sync when your connection returns.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
